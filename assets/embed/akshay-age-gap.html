<style>
  :root{
    --bg:#080814;
    --orange:#ff6b35;
    --teal:#2ec4b6;
    --white:#ffffff;
    --muted:#9bb0c9;
    --grid:#1c2540;
  }
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:var(--white);
    font-family:'Helvetica Neue',Arial,sans-serif;
    height:100%;
    overflow:hidden;
  }
  .wrap{
    width:100vw;height:100vh;
    box-sizing:border-box;
    padding:0;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame{
    box-sizing:border-box;
    border:1px solid #ffffff;
    background:var(--bg);
    padding:22px 28px 18px;
    display:flex;flex-direction:column;
    position:relative;
    aspect-ratio:1 / 1;
    height:min(100vh, 100vw);
    width:min(100vh, 100vw);
  }
  h1{
    font-size:17px;
    letter-spacing:0.5px;
    margin:0 0 8px;
    font-weight:300;
    line-height:1.2;
    text-align:left;
    text-transform:uppercase;
    white-space:nowrap;
  }
  h1 .ak, h1 .tag{font-weight:500;}
  h1 .ak{color:var(--orange);}
  h1 .mid{color:var(--white);}
  h1 .tag{color:var(--teal);}
  svg{
    display:block;
    flex:1;
    min-height:0;
    width:100%;
    margin:0 auto;
  }
  .axis text{fill:var(--muted);font-size:22px;font-weight:500;}
  .axis path,.axis line{stroke:transparent;}
  .gridline{stroke:var(--grid);stroke-width:1px;}
  .bar{fill:var(--teal);cursor:pointer;transition:fill .15s;}
  .bar:hover{fill:#ffffff;}
  .bar-label{fill:var(--teal);font-size:19px;text-anchor:middle;font-weight:700;}
  .line{fill:none;stroke:var(--orange);stroke-width:2.2px;}
  .dot{fill:var(--bg);stroke:var(--orange);stroke-width:2px;}
  .line-label{fill:var(--orange);font-size:19px;text-anchor:middle;font-weight:700;}
  .limit-line{stroke:var(--muted);stroke-width:1px;fill:none;}
  .limit-tag{fill:var(--muted);font-size:13px;font-weight:500;}
  .limit-circle{fill:none;stroke:var(--muted);stroke-width:1.2px;}
  .limit-num{fill:var(--teal);font-size:11px;font-weight:700;text-anchor:middle;}
  .legend text{fill:var(--white);font-size:20px;font-weight:500;}
  #tooltip{
    position:absolute;
    pointer-events:none;
    background:#0a1126;
    border:1px solid var(--teal);
    border-radius:6px;
    padding:8px 10px;
    font-size:12px;
    color:var(--white);
    line-height:1.45;
    box-shadow:0 4px 12px rgba(0,0,0,.5);
    opacity:0;
    transition:opacity .12s;
    z-index:10;
    min-width:160px;
  }
  #tooltip .ttl{color:var(--orange);font-weight:700;margin-bottom:3px;}
  #tooltip .row{display:flex;justify-content:space-between;gap:12px;}
  #tooltip .k{color:var(--muted);}
  #tooltip .gap{color:var(--teal);font-weight:700;margin-top:4px;border-top:1px solid #23365c;padding-top:4px;}
  .toggle{
    position:absolute;
    top:18px;right:18px;
    display:inline-flex;align-items:center;gap:10px;
    margin:0;padding:6px 12px;
    background:#0e1430;border:1px solid #23365c;border-radius:999px;
    color:var(--white);font-size:12px;cursor:pointer;user-select:none;
    font-family:inherit;
    z-index:20;
  }
  .toggle:hover{border-color:var(--teal);}
  .toggle .sw{
    width:28px;height:16px;background:#23365c;border-radius:999px;position:relative;transition:background .2s;
  }
  .toggle .sw::after{
    content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;
    background:var(--white);border-radius:50%;transition:transform .2s;
  }
  .toggle.on .sw{background:var(--teal);}
  .toggle.on .sw::after{transform:translateX(12px);}
</style>
</head>
<body>

2025,Jolly LLB 3,Huma Qureshi,1986,39,58
2026,Bhooth Bangla,Wamiqa Gabi,1993,33,59`;

const rows = d3.csvParse(raw, d => ({
  Year:+d.Year, Title:d.Title, RI:d.RI,
  RI_Age:d.RI_Age?+d.RI_Age:null,
  AK_Age:+d.AK_Age
}));

// Group by year: keep every film (no averaging). One mini-bar per film within the year's slot.
const filmed = rows.filter(d => d.RI_Age != null);
const byYear = d3.rollups(filmed,
  v => ({
    films: v,
    ak: v[0].AK_Age,
    avgRI: d3.mean(v, d=>d.RI_Age)
  }),
  d => d.Year
).map(([year, o]) => ({year, ...o}))
 .sort((a,b)=>a.year-b.year);

const width = 1000, height = 1000;
const margin = {top:80, right:60, bottom:70, left:70};
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const svg = d3.select('#chart');
const g = svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);

const x = d3.scaleBand()
  .domain(byYear.map(d=>d.year))
  .range([0, innerW])
  .padding(0.22);

const allRIages = byYear.flatMap(d=>d.films.map(f=>f.RI_Age));
const yMax = Math.max(d3.max(byYear,d=>d.ak), d3.max(allRIages)) + 6;
const y = d3.scaleLinear()
  .domain([0, yMax])
  .range([innerH, 0]);

// gridlines (subtle horizontal only)
g.append('g')
  .selectAll('line')
  .data(y.ticks(10))
  .join('line')
  .attr('class','gridline')
  .attr('x1',0).attr('x2',innerW)
  .attr('y1',d=>y(d)).attr('y2',d=>y(d));

// y axis
g.append('g')
  .attr('class','axis')
  .call(d3.axisLeft(y).ticks(7).tickSize(0).tickPadding(12))
  .call(s=>s.select('.domain').remove());

// x axis (years, abbreviated) — every other year, no overlap
const xVals = byYear.map(d => d.year);
const xTickVals = xVals.filter(y => y % 2 === 1);
const xAxis = d3.axisBottom(x)
  .tickValues(xTickVals)
  .tickFormat(d => "'" + String(d).slice(-2))
  .tickSize(0)
  .tickPadding(12);
g.append('g')
  .attr('class','axis')
  .attr('transform',`translate(0,${innerH})`)
  .call(xAxis)
  .call(s=>s.select('.domain').remove());

// one bar per year — average heroine age
const barsG = g.append('g').attr('class','bars');
barsG.selectAll('rect')
  .data(byYear)
  .join('rect')
  .attr('class','bar')
  .attr('x', d => x(d.year))
  .attr('y', d => y(d.avgRI))
  .attr('width', x.bandwidth())
  .attr('height', d => innerH - y(d.avgRI));

barsG.selectAll('text')
  .data(byYear)
  .join('text')
  .attr('class','bar-label')
  .attr('x', d => x(d.year) + x.bandwidth()/2)
  .attr('y', d => y(d.avgRI) - 5)
  .text(d => Math.round(d.avgRI));

// Leo-style smooth line through each year's center (Akshay age)
const linePts = byYear.map(d => ({
  cx: x(d.year) + x.bandwidth()/2,
  yv: d.ak
}));
const lineGen = d3.line().x(p=>p.cx).y(p=>y(p.yv));
g.append('path')
  .datum(linePts)
  .attr('class','line')
  .attr('d',lineGen);

// outlined dots at each year (Leo-style: hollow circles)
g.append('g')
  .selectAll('circle')
  .data(linePts)
  .join('circle')
  .attr('class','dot')
  .attr('cx',p=>p.cx)
  .attr('cy',p=>y(p.yv))
  .attr('r',4.5);

// numeric labels above each dot (Leo-style)
g.append('g')
  .selectAll('text')
  .data(byYear)
  .join('text')
  .attr('class','line-label')
  .attr('x',d=>x(d.year)+x.bandwidth()/2)
  .attr('y',d=>y(d.ak)-10)
  .text(d => Math.round(d.ak));

// Legend — top-left of the chart area (Leo-style: bar swatch + line+dot swatch)
const legend = svg.append('g').attr('class','legend')
  .attr('transform',`translate(${margin.left + 30},${margin.top + 20})`);
// bar swatch
legend.append('rect').attr('fill','var(--teal)').attr('x',0).attr('y',0).attr('width',38).attr('height',8);
legend.append('text').attr('x',50).attr('y',9).text("Average age of heroines romanced that year");
// line swatch
legend.append('line').attr('x1',0).attr('x2',38).attr('y1',32).attr('y2',32).attr('stroke','var(--orange)').attr('stroke-width',2.2);
legend.append('circle').attr('cx',19).attr('cy',32).attr('r',4.5).attr('fill','var(--bg)').attr('stroke','var(--orange)').attr('stroke-width',2);
legend.append('text').attr('x',50).attr('y',36).text("Akshay's Age");

</script>

</html>
