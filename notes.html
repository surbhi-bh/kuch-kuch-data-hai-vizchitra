<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speaker View</title>
<style>
  body {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 18px;
    margin: 0;
    padding: 0;
    background: #f7f7f7;
    color: #222;
    height: 100vh;
    overflow: hidden;
  }

  #current-slide,
  #upcoming-slide,
  #speaker-controls {
    padding: 6px;
    box-sizing: border-box;
    position: absolute;
  }

  #current-slide .slide-frame,
  #upcoming-slide .slide-frame {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    border: 1px solid #ddd;
    overflow: hidden;
  }

  #current-slide iframe,
  #upcoming-slide iframe {
    border: 0;
    background: #fff;
    transform-origin: top left;
    position: absolute;
  }

  .label {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 2;
    height: 34px;
    line-height: 34px;
    padding: 0 10px;
    text-shadow: none;
    background: rgba(220, 220, 220, 0.85);
    color: #222;
    font-size: 14px;
    border-radius: 3px;
  }

  /* Current slide thumbnail on the left (larger), notes on the right */
  #upcoming-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 60%;
    height: 100%;
    padding: 12px;
    box-sizing: border-box;
  }
  #speaker-controls {
    top: 0;
    right: 0;
    width: 40%;
    height: 100%;
    overflow: auto;
    font-size: 18px;
    box-sizing: border-box;
  }

  .speaker-controls-time,
  .speaker-controls-pace {
    border-bottom: 1px solid rgba(200, 200, 200, 0.7);
    margin-bottom: 10px;
    padding: 10px 16px 20px;
    cursor: pointer;
    position: relative;
  }

  .speaker-controls-time .label,
  .speaker-controls-pace .label,
  .speaker-controls-notes .label {
    position: static;
    background: none;
    padding: 0;
    height: auto;
    line-height: normal;
    text-transform: uppercase;
    font-weight: normal;
    font-size: 0.66em;
    color: #666;
    margin: 0;
    display: block;
  }

  .speaker-controls-time .reset-button {
    opacity: 0;
    float: right;
    color: #666;
    text-decoration: none;
    font-size: 0.7em;
    line-height: 1.9em;
  }

  .speaker-controls-time:hover .reset-button {
    opacity: 1;
  }

  .speaker-controls-time .timer,
  .speaker-controls-time .clock {
    width: 50%;
    font-size: 1.9em;
  }

  .speaker-controls-time .timer {
    float: left;
  }

  .speaker-controls-time .clock {
    float: right;
    text-align: right;
  }

  .speaker-controls-time span.mute {
    opacity: 0.3;
  }

  .clear { clear: both; }

  .speaker-controls-notes {
    padding: 10px 16px;
  }

  .speaker-controls-notes .value {
    margin-top: 5px;
    line-height: 1.5;
    font-size: 1.6em;
    white-space: pre-wrap;
  }

  #status-bar {
    position: fixed;
    bottom: 6px;
    right: 12px;
    font-size: 12px;
    color: #888;
    z-index: 30;
  }

  #hint-bar {
    position: fixed;
    bottom: 6px;
    left: 12px;
    font-size: 12px;
    color: #888;
    z-index: 30;
  }
</style>
</head>
<body>

<div id="upcoming-slide">
  <span class="label">Current</span>
  <div class="slide-frame"><iframe id="nextF"></iframe></div>
</div>

<div id="speaker-controls">
  <div class="speaker-controls-time" title="Click to reset the timer">
    <h4 class="label">Time <a href="#" class="reset-button" id="resetTimer">Click to reset</a></h4>
    <div class="clock"><span id="clockValue">--:--</span></div>
    <div class="timer"><span id="timerValue">00:00:00</span></div>
    <div class="clear"></div>
  </div>

  <div class="speaker-controls-notes">
    <h4 class="label">Notes</h4>
    <div class="value" id="notesEl">(no notes)</div>
  </div>
</div>

<div id="hint-bar">arrows navigate the main deck</div>
<div id="status-bar"><span id="statusEl">–</span></div>

<script>
  const CHANNEL = 'vc-bollywood-notes';
  const BASE = 'index.html';
  const bc = new BroadcastChannel(CHANNEL);
  const notesEl = document.getElementById('notesEl');
  const statusEl = document.getElementById('statusEl');
  const clockValue = document.getElementById('clockValue');
  const timerValue = document.getElementById('timerValue');
  const resetTimer = document.getElementById('resetTimer');
  const nextF = document.getElementById('nextF');

  // Fit the 1280x720 upcoming iframe into its parent .slide-frame.
  function fitNext() {
    const parent = nextF.parentElement.getBoundingClientRect();
    if (parent.width < 10 || parent.height < 10) return;
    const s = Math.min(parent.width / 1280, parent.height / 720);
    nextF.style.width = '1280px';
    nextF.style.height = '720px';
    nextF.style.border = '0';
    nextF.style.background = '#fff';
    nextF.style.transformOrigin = 'top left';
    nextF.style.position = 'absolute';
    nextF.style.transform = 'scale(' + s + ')';
    nextF.style.left = ((parent.width - 1280 * s) / 2) + 'px';
    nextF.style.top = ((parent.height - 720 * s) / 2) + 'px';
  }
  window.addEventListener('resize', fitNext);
  nextF.addEventListener('load', fitNext);
  nextF.src = BASE + '?t=' + Date.now() + '#p=0&s=0&r=1';
  setTimeout(fitNext, 120);

  // ============================================================
  // Self-contained speaker view. On every render, read the deck's
  // current state directly from window.opener (the deck window) —
  // no messaging, no caching, no races. If there's no opener, fall
  // back to fetching index.html and tracking a local index.
  // ============================================================

  function notesForRaw(raw, shownCount) {
    if (!raw) return '';
    if (!raw.includes('|||')) return raw;
    const rawParts = raw.split(/\|\|\|(@\d+)?/);
    const segments = [];
    for (let k = 0; k < rawParts.length; k++) {
      const chunk = rawParts[k];
      if (chunk == null) continue;
      if (/^@\d+$/.test(chunk)) {
        const t = parseInt(chunk.slice(1), 10);
        if (segments.length) segments[segments.length - 1].threshold = t;
        continue;
      }
      segments.push({ threshold: segments.length, text: chunk.trim() });
    }
    let picked = segments[0];
    for (const seg of segments) if (shownCount >= seg.threshold) picked = seg;
    return picked ? picked.text : '';
  }

  // Read deck state directly from window.opener. Returns null if no opener.
  function readDeckState() {
    try {
      if (!window.opener || window.opener.closed) return null;
      const doc = window.opener.document;
      const slides = doc.querySelectorAll('.slide');
      if (!slides.length) return null;
      let activeIdx = 0;
      for (let k = 0; k < slides.length; k++) {
        if (slides[k].classList.contains('active')) { activeIdx = k; break; }
      }
      const active = slides[activeIdx];
      const shownCount = active.querySelectorAll('.r-step.shown').length;
      const raw = active.getAttribute('data-notes') || '';
      return { index: activeIdx, step: shownCount, total: slides.length, raw };
    } catch (_) { return null; }
  }

  let lastCurrentIdx = -1;
  let lastCurrentStep = -1;
  function render() {
    const s = readDeckState();
    if (!s) {
      statusEl.textContent = 'no deck window';
      notesEl.textContent = 'Open the deck and press S to launch the speaker view.';
      return;
    }
    const text = notesForRaw(s.raw, s.step);
    notesEl.textContent = text || '(no notes)';
    statusEl.textContent = (s.index + 1) + ' / ' + s.total + ' • step ' + s.step;
    if (s.index !== lastCurrentIdx || s.step !== lastCurrentStep) {
      nextF.src = BASE + '?t=' + Date.now() + '#p=' + s.index + '&s=' + s.step + '&r=1';
      lastCurrentIdx = s.index;
      lastCurrentStep = s.step;
      setTimeout(fitNext, 120);
    }
  }

  function sendNav(dir) {
    let delivered = false;
    try {
      if (window.opener && !window.opener.closed) {
        const fn = dir === 'next' ? window.opener.deckNext : window.opener.deckPrev;
        if (typeof fn === 'function') { fn(); delivered = true; }
      }
    } catch (_) {}
    // Fallback for when there's no opener (speaker opened by URL, not via S).
    if (!delivered) {
      try { localStorage.setItem('vc-nav', dir + ':' + Date.now()); } catch (_) {}
    }
    requestAnimationFrame(render);
    setTimeout(render, 50);
  }

  function onKey(e) {
    console.log('[speaker] keydown', e.key);
    if (e.key === 'ArrowRight' || e.key === ' ') { sendNav('next'); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { sendNav('prev'); e.preventDefault(); }
  }
  window.addEventListener('keydown', onKey);
  window.focus();
  document.body.addEventListener('click', () => window.focus());

  // Also poll every 500ms so if the user navigates from the deck window,
  // the notes stay in sync without needing any messaging.
  setInterval(render, 500);
  render();

  // ============ Clock + Timer ============
  let timerStart = Date.now();

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function tick() {
    const now = new Date();
    const hh = pad(now.getHours());
    const mm = pad(now.getMinutes());
    clockValue.innerHTML = hh + '<span class="mute">:</span>' + mm;

    const elapsed = Math.floor((Date.now() - timerStart) / 1000);
    const h = Math.floor(elapsed / 3600);
    const m = Math.floor((elapsed % 3600) / 60);
    const s = elapsed % 60;
    timerValue.innerHTML =
      pad(h) + '<span class="mute">:</span>' +
      pad(m) + '<span class="mute">:</span>' +
      pad(s);
  }
  setInterval(tick, 1000);
  tick();

  resetTimer.addEventListener('click', (e) => {
    e.preventDefault();
    timerStart = Date.now();
    tick();
  });
  document.querySelector('.speaker-controls-time').addEventListener('click', (e) => {
    if (e.target === resetTimer) return;
    timerStart = Date.now();
    tick();
  });
</script>
</body>
</html>
